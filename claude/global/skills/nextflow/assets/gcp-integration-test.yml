name: GCP integration test
# Run the production Google Batch command on [gcp-project].
# Requires repository secrets: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_CI_SERVICE_ACCOUNT.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NXF_ANSI_LOG: false

jobs:
  gcp-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require GCP CI secrets
        env:
          GCP_WIF: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SA: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GCP_WIF" ] || [ -z "$GCP_SA" ]; then
            echo "Repository secrets GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_CI_SERVICE_ACCOUNT must be set." >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Application Default Credentials for Nextflow
        run: |
          gcloud auth login --quiet --cred-file="$GOOGLE_APPLICATION_CREDENTIALS" --update-adc
          echo "GOOGLE_APPLICATION_CREDENTIALS=" >> "$GITHUB_ENV"

      - uses: nf-core/setup-nextflow@b4ec1bc7c16a94435159de94a05253542fddf6ef # v3

      - name: Run pipeline on Google Batch
        run: |
          nextflow run main.nf \
            -profile googlebatch \
            -work-dir "[gcp-scratch-bucket]/ci/${{ github.run_id }}/work" \
            --outdir "[gcp-scratch-bucket]/ci/${{ github.run_id }}/results" \
            --input assets/samplesheet_test_googlebatch.csv \
            --reference_database [gcp-reference-bucket]/<database-path>/
